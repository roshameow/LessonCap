<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LessonCap — Synthetic Capture Exercise</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#07111b;color:white;font-family:system-ui,sans-serif}main{max-width:1280px;aspect-ratio:16/9;margin:auto;background:#142739;padding:5.5%;position:relative;display:flex;flex-direction:column}.eyebrow{color:#68d5bd;font-size:clamp(9px,1.1vw,14px);letter-spacing:.08em}h1{font-size:clamp(22px,3.4vw,44px);margin:30px 0 12px}p{color:#b6cad5;font-size:clamp(12px,1.8vw,23px)}ol{list-style:none;padding:0;margin:32px 0;counter-reset:steps}li{counter-increment:steps;font-size:clamp(12px,1.8vw,23px);margin:20px 0;display:flex;align-items:center;gap:20px}li:before{content:counter(steps);display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:50%;background:#68d5bd;color:#142739;font-size:17px;font-weight:700}footer{margin-top:auto;border-top:1px solid #355164;padding-top:18px;display:flex;justify-content:space-between;font-size:12px;color:#a7bfcb}nav{max-width:1280px;margin:16px auto;display:flex;gap:12px;align-items:center;font-size:13px;color:#a7bfcb}button{padding:10px 18px;border:1px solid #355164;border-radius:5px;background:#142739;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #68d5bd}nav span{margin-left:auto}</style>
</head><body>
<main><div class="eyebrow">LESSONCAP / SYNTHETIC SAMPLE</div><h1 id="title"></h1><p id="subtitle"></p><ol id="steps"></ol><footer><span>Synthetic slides for manual capture practice. No actual lecture content.</span><span id="page"></span></footer></main>
<nav aria-label="Slide controls"><button id="previous">Previous</button><button id="next">Next</button><span>Capture the slide rectangle above, excluding these controls.</span></nav>
<script>
const slides=[['Choose a capture region','Keep the slide inside the selected area.',['Open these sample slides in a browser.','Use LessonCap to select the slide rectangle.','Start capture before moving to the next page.']],['Capture a page change','A large content change makes the exercise easy to inspect.',['Advance to this slide after capture starts.','Wait several seconds before changing pages again.','Observe whether the captured-slide count increases.']],['Stop and export','Review the result before relying on it for a real lecture.',['Stop capture in LessonCap.','Export the captured pages as a PDF.','Check page order, boundaries, duplicates and readability.']]];
let current=0;function render(){const s=slides[current];document.getElementById('title').textContent=s[0];document.getElementById('subtitle').textContent=s[1];document.getElementById('steps').replaceChildren(...s[2].map(text=>{const li=document.createElement('li');li.textContent=text;return li}));document.getElementById('page').textContent=`${current+1} / ${slides.length}`;document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}
document.getElementById('previous').onclick=()=>{current=Math.max(0,current-1);render()};document.getElementById('next').onclick=()=>{current=Math.min(slides.length-1,current+1);render()};render();
</script></body></html>
