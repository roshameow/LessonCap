name: Frontend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lesson-cap/frontend/package-lock.json
      - run: npm ci --prefix lesson-cap/frontend
      - run: npm run build --prefix lesson-cap/frontend
